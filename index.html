<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CU Law Exam Answer Generator</title>
    <!-- Fonts: Google Fonts (Inter & Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <div class="background-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div class="app-container">
      <header>
        <h1>CU Law Answer Generator</h1>
        <p>16-Mark High-Scoring Output Generator</p>
      </header>

      <main>
        <div class="tab-container">
          <button class="tab-btn active" data-tab="tab-generator">Answer Generator</button>
          <button class="tab-btn" data-tab="tab-search">Case Law Search</button>
        </div>

        <div id="tab-generator" class="tab-content">
          <section class="glass-panel input-section">
          <div class="input-group">
            <label for="subject-select">Subject</label>
            <select id="subject-select">
              <optgroup label="Semester 1">
                <option value="General Principles of Law of Contract">General Principles of Law of Contract</option>
                <option value="Family Law - I">Family Law - I</option>
              </optgroup>
              <optgroup label="Semester 2">
                <option value="Special Contract">Special Contract</option>
                <option value="Family Law - II">Family Law - II</option>
              </optgroup>
              <optgroup label="Semester 3">
                <option value="Competition Law">Competition Law</option>
                <option value="Law of Torts including MV Accident and Consumer Protection Laws">Law of Torts including MV Accident and Consumer Protection Laws</option>
              </optgroup>
              <optgroup label="Semester 4">
                <option value="Constitutional Law - I">Constitutional Law - I</option>
                <option value="Law of Crimes - I (Bharatiya Nyaya Sanhita)">Law of Crimes - I (Bharatiya Nyaya Sanhita)</option>
                <option value="Land Laws including Ceiling and Other Local Laws">Land Laws including Ceiling and Other Local Laws</option>
              </optgroup>
              <optgroup label="Semester 5">
                <option value="Constitutional Law - II">Constitutional Law - II</option>
                <option value="Administrative Law">Administrative Law</option>
                <option value="Property Law">Property Law</option>
              </optgroup>
              <optgroup label="Semester 6">
                <option value="Law of Crimes - II (Bharatiya Nagarik Suraksha Sanhita)">Law of Crimes - II (Bharatiya Nagarik Suraksha Sanhita)</option>
                <option value="Civil Procedure Code and Limitation">Civil Procedure Code and Limitation</option>
                <option value="Law of Copyright">Law of Copyright</option>
                <option value="Jurisprudence and Legal Theory">Jurisprudence and Legal Theory</option>
              </optgroup>
              <optgroup label="Semester 7">
                <option value="Public International Law">Public International Law</option>
                <option value="Banking Law">Banking Law</option>
                <option value="Law of Evidence (Bharatiya Sakshya Adhiniyam)">Law of Evidence (Bharatiya Sakshya Adhiniyam)</option>
              </optgroup>
              <optgroup label="Semester 8">
                <option value="Human Rights Law and Practice">Human Rights Law and Practice</option>
                <option value="Interpretation of Statutes and Principles of Legislation">Interpretation of Statutes and Principles of Legislation</option>
                <option value="Labour and Industrial Law - I">Labour and Industrial Law - I</option>
              </optgroup>
              <optgroup label="Semester 9">
                <option value="Company Law">Company Law</option>
                <option value="Information Technology Law">Information Technology Law</option>
                <option value="Labour and Industrial Laws - II">Labour and Industrial Laws - II</option>
              </optgroup>
              <optgroup label="Semester 10">
                <option value="Taxation Law (Income Tax & GST)">Taxation Law (Income Tax & GST)</option>
                <option value="Environmental Law">Environmental Law</option>
              </optgroup>
            </select>
          </div>

          <div class="input-group">
            <label for="marks-select">Marks / Weightage</label>
            <select id="marks-select">
              <option value="16">16 Marks (1,000–1,200 Words - Comprehensive Essay Answer)</option>
              <option value="10">10 Marks (600–800 Words - Standard Main Answer)</option>
              <option value="4/6">4/6 Marks (250–350 Words - Short Note / Focused Concept)</option>
            </select>
          </div>

          <div class="input-group">
            <label for="question">Exam Question</label>
            <textarea id="question" rows="4" placeholder="e.g. Define privity of contract along with its exceptions. Discuss with the help of case laws."></textarea>
          </div>
          
          <div class="button-group">
            <button id="generateBtn" class="primary-btn">
              <span class="btn-text">Generate Answer</span>
              <div class="spinner hidden" id="loadingSpinner"></div>
            </button>
            <button id="downloadPdfBtn" class="secondary-btn" disabled>
              Download PDF
            </button>
          </div>
        </section>

        <section class="glass-panel output-section hidden" id="outputSection">
          <div class="output-header">
            <h2>Generated Answer</h2>
            <button id="copyBtn" class="icon-btn" title="Copy to Clipboard">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
          <div id="outputContent" class="markdown-body">
            <!-- Answer goes here -->
          </div>
        </section>
        </div>

        <div id="tab-search" class="tab-content hidden">
          <section class="glass-panel input-section">
            <div class="input-group">
              <label for="search-topic">Legal Topic / Concept</label>
              <input type="text" id="search-topic" placeholder="e.g. Free Consent, Minor Agreement" />
            </div>
            
            <button id="searchBtn" class="primary-btn">
              <span class="btn-text" id="searchBtnText">Search Cases</span>
              <div class="spinner hidden" id="searchLoadingSpinner"></div>
            </button>
          </section>

          <section class="glass-panel output-section hidden" id="searchOutputSection">
            <div class="output-header">
              <h2>Search Results</h2>
            </div>
            <div id="searchOutputContent" class="markdown-body">
              <!-- Search results table goes here -->
            </div>
          </section>
        </div>
      </main>
      
      <footer>
        <p>Designed for Calcutta University BA LLB Students</p>
      </footer>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
