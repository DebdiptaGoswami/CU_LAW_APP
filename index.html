<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CU Law Exam Answer Generator</title>
    <!-- Fonts: Google Fonts (Inter & Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="background-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div class="app-container">
      <header>
        <h1>CU Law Answer Generator</h1>
        <p>16-Mark High-Scoring Output Generator</p>
      </header>

      <main>
        <!-- Settings section removed for server-side API Key handling -->

        <section class="glass-panel input-section">
          <div class="input-group">
            <label for="question">Exam Question (16 Marks)</label>
            <textarea id="question" rows="4" placeholder="e.g. Define privity of contract along with its exceptions. Discuss with the help of case laws."></textarea>
          </div>
          
          <button id="generateBtn" class="primary-btn">
            <span class="btn-text">Generate Answer</span>
            <div class="spinner hidden" id="loadingSpinner"></div>
          </button>
        </section>

        <section class="glass-panel output-section hidden" id="outputSection">
          <div class="output-header">
            <h2>Generated Answer</h2>
            <button id="copyBtn" class="icon-btn" title="Copy to Clipboard">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
          <div id="outputContent" class="markdown-body">
            <!-- Answer goes here -->
          </div>
        </section>
      </main>
      
      <footer>
        <p>Designed for Calcutta University BA LLB Students</p>
      </footer>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
