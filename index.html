<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CU Law Exam Engine</title>
    <!-- Fonts: Google Fonts (Inter & Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">Copied to clipboard!</div>

    <!-- History Drawer -->
    <div id="history-overlay" class="drawer-overlay hidden"></div>
    <aside id="history-drawer" class="drawer">
      <div class="drawer-header">
        <h2>Recent History</h2>
        <button id="closeHistoryBtn" class="icon-btn" title="Close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="history-list" class="drawer-content">
        <!-- History items go here -->
        <p class="empty-history">No recent history found.</p>
      </div>
    </aside>

    <div class="background-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div class="app-container">
      <header>
        <div class="header-top">
          <button id="openHistoryBtn" class="header-action-btn" title="View History">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            History
          </button>
          <div class="badge">2025 CBCS Syllabus Compliant</div>
          <button id="themeToggleBtn" class="header-action-btn icon-btn" title="Toggle Light/Dark Mode">
            <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
        <h1>CU Law Exam Engine</h1>
        <p>Premium Answer Formatting & Case Law Search</p>
      </header>

      <main>
        <div class="tab-container">
          <button class="tab-btn active" data-tab="tab-generator">Answer Generator</button>
          <button class="tab-btn" data-tab="tab-search">Case Law Search</button>
        </div>

        <div id="tab-generator" class="tab-content">
          <section class="glass-panel input-section">
            
            <div class="grid-2-col">
              <div class="input-group">
                <label for="subject-select">Subject</label>
                <div class="select-wrapper">
                  <select id="subject-select">
                    <optgroup label="Semester 1">
                      <option value="General Principles of Law of Contract">General Principles of Law of Contract</option>
                      <option value="Family Law - I">Family Law - I</option>
                    </optgroup>
                    <optgroup label="Semester 2">
                      <option value="Special Contract">Special Contract</option>
                      <option value="Family Law - II">Family Law - II</option>
                    </optgroup>
                    <optgroup label="Semester 3">
                      <option value="Competition Law">Competition Law</option>
                      <option value="Law of Torts including MV Accident and Consumer Protection Laws">Law of Torts including MV Accident and Consumer Protection Laws</option>
                    </optgroup>
                    <optgroup label="Semester 4">
                      <option value="Constitutional Law - I">Constitutional Law - I</option>
                      <option value="Law of Crimes - I (Bharatiya Nyaya Sanhita)">Law of Crimes - I (Bharatiya Nyaya Sanhita)</option>
                      <option value="Land Laws including Ceiling and Other Local Laws">Land Laws including Ceiling and Other Local Laws</option>
                    </optgroup>
                    <optgroup label="Semester 5">
                      <option value="Constitutional Law - II">Constitutional Law - II</option>
                      <option value="Administrative Law">Administrative Law</option>
                      <option value="Property Law">Property Law</option>
                    </optgroup>
                    <optgroup label="Semester 6">
                      <option value="Law of Crimes - II (Bharatiya Nagarik Suraksha Sanhita)">Law of Crimes - II (Bharatiya Nagarik Suraksha Sanhita)</option>
                      <option value="Civil Procedure Code and Limitation">Civil Procedure Code and Limitation</option>
                      <option value="Law of Copyright">Law of Copyright</option>
                      <option value="Jurisprudence and Legal Theory">Jurisprudence and Legal Theory</option>
                    </optgroup>
                    <optgroup label="Semester 7">
                      <option value="Public International Law">Public International Law</option>
                      <option value="Banking Law">Banking Law</option>
                      <option value="Law of Evidence (Bharatiya Sakshya Adhiniyam)">Law of Evidence (Bharatiya Sakshya Adhiniyam)</option>
                    </optgroup>
                    <optgroup label="Semester 8">
                      <option value="Human Rights Law and Practice">Human Rights Law and Practice</option>
                      <option value="Interpretation of Statutes and Principles of Legislation">Interpretation of Statutes and Principles of Legislation</option>
                      <option value="Labour and Industrial Law - I">Labour and Industrial Law - I</option>
                    </optgroup>
                    <optgroup label="Semester 9">
                      <option value="Company Law">Company Law</option>
                      <option value="Information Technology Law">Information Technology Law</option>
                      <option value="Labour and Industrial Laws - II">Labour and Industrial Laws - II</option>
                    </optgroup>
                    <optgroup label="Semester 10">
                      <option value="Taxation Law (Income Tax & GST)">Taxation Law (Income Tax & GST)</option>
                      <option value="Environmental Law">Environmental Law</option>
                    </optgroup>
                  </select>
                </div>
              </div>

              <div class="input-group">
                <label for="marks-select">Marks / Weightage</label>
                <div class="select-wrapper">
                  <select id="marks-select">
                    <option value="16">16 Marks (1,000–1,200 Words)</option>
                    <option value="10">10 Marks (600–800 Words)</option>
                    <option value="4/6">4/6 Marks (250–350 Words)</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="input-group">
              <label for="question">Exam Question</label>
              <textarea id="question" rows="4" placeholder="e.g. Define privity of contract along with its exceptions..."></textarea>
              <div class="text-counter" id="textCounter">0 words | 0 characters</div>
            </div>
            
            <button id="generateBtn" class="primary-btn pulse-hover">
              <span class="btn-text">Generate Answer</span>
              <div class="spinner hidden" id="loadingSpinner"></div>
            </button>
          </section>

          <section class="glass-panel output-section hidden" id="outputSection">
            <div class="output-header">
              <h2>Generated Output</h2>
              <div class="action-toolbar">
                <button id="readAloudBtn" class="icon-btn action-btn" title="Read Aloud">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </button>
                <button id="downloadPdfBtn" class="icon-btn action-btn" title="Download PDF">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
                <button id="copyBtn" class="icon-btn action-btn" title="Copy to Clipboard">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
              </div>
            </div>
            
            <!-- Skeleton Loader -->
            <div id="skeletonLoader" class="skeleton-wrapper hidden">
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-text"></div>
              <div class="skeleton skeleton-text"></div>
              <div class="skeleton skeleton-text short"></div>
              <div class="skeleton skeleton-box"></div>
            </div>

            <div id="outputContent" class="markdown-body">
              <!-- Answer goes here -->
            </div>
          </section>
        </div>

        <div id="tab-search" class="tab-content hidden">
          <section class="glass-panel input-section">
            <div class="input-group">
              <label for="search-topic">Legal Topic / Concept</label>
              <input type="text" id="search-topic" placeholder="e.g. Free Consent, Minor Agreement" />
            </div>
            
            <button id="searchBtn" class="primary-btn pulse-hover">
              <span class="btn-text" id="searchBtnText">Search Cases</span>
              <div class="spinner hidden" id="searchLoadingSpinner"></div>
            </button>
          </section>

          <section class="glass-panel output-section hidden" id="searchOutputSection">
            <div class="output-header">
              <h2>Search Results</h2>
            </div>
            <div id="searchSkeletonLoader" class="skeleton-wrapper hidden">
              <div class="skeleton skeleton-box"></div>
              <div class="skeleton skeleton-text"></div>
            </div>
            <div id="searchOutputContent" class="markdown-body">
              <!-- Search results table goes here -->
            </div>
          </section>
        </div>
      </main>
      
      <footer>
        <p>Engineered for Calcutta University BA LLB Students</p>
      </footer>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
